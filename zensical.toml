# Link validation: broken pages/anchors are reported (warnings; the build does not fail).
# Zensical validates links and anchors only; the MkDocs omitted_files / absolute_links /
# unrecognized_links checks have no Zensical equivalent.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
# Zensical's default is the new "modern" look; "classic" keeps the Material-for-MkDocs
# appearance this site (and extra.css) was built against.
variant = "classic"
custom_dir = "overrides"
logo = "assets/logo-oryx.png"
favicon = "assets/favicon.ico"
# Don't let the theme load Roboto from fonts.googleapis.com. That injected a
# stylesheet from a second origin into the critical path (a DNS + TLS handshake
# before any text could render), which is what Search Console flagged as slow.
# The same fonts are self-hosted from assets/fonts/ and declared in
# assets/extra.css, so they arrive on the connection the page already has open.
# Turning this off also drops the theme's own :root font variables - extra.css
# sets --md-text-font / --md-code-font in their place. Keep the two in sync.
font = false
features = [
    "navigation.tabs",
    "navigation.instant",
    "navigation.tracking",
    "navigation.sections",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "toc.follow",
    "content.code.copy",
    "content.action.edit",
    "search.suggest",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"          # black top nav banner
accent = "blue"            # hover/active accent
toggle = { icon = "material/weather-night", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "blue"
toggle = { icon = "material/weather-sunny", name = "Switch to light mode" }

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.def_list]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

# Renders :material-*: / :fontawesome-*: icon shortcodes (used in the card grids)
# as inline SVGs instead of literal text. (Dotted paths replace YAML's !!python/name.)
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "material.extensions.emoji.twemoji"
emoji_generator = "material.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.snippets]
base_path = [".", "docs"]
check_paths = true

[project.plugins.search]

[project.plugins.blog]
blog_dir = "blog"
# SEO-friendly permalinks: /blog/<category>/<slug> - no date in the URL (dates
# signal staleness on evergreen posts; freshness comes from sitemap <lastmod>),
# one topical category segment for topic-hub siloing, keyword-first slugs (set
# per post via `slug:` in front-matter).
post_url_format = "{categories}/{slug}"
post_url_max_categories = 1
# Every post must have a <!-- more --> excerpt marker, so the /blog/ index shows
# teasers that link to each post, never the full bodies inline.
post_excerpt = "required"
post_readtime = true

[project.plugins.mkdocstrings]
default_handler = "python"

# No `paths`: the API page documents the installed oryxflow package
# (pip install ../oryxflow), which griffe finds on sys.path.
[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
show_source = true
members_order = "source"
separate_signature = true
filters = ["!^_"]

# llmstxt must run last so it captures the final rendered pages.
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """oryxflow is a small, self-contained Python library for building data-science workflows: \
declare Task classes with parameters, dependencies (requires) and a run() that save()s \
output; the engine runs the DAG in dependency order, skips tasks whose output already \
exists, and reruns exactly what a parameter, data, or code change affects."""

[project.plugins.llmstxt.sections]
