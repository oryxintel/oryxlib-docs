# zensical.toml - oryxflow / oryxeval documentation site (built with Zensical)
#
# Build:   python scripts/build_docs.py   # fetch sources, doc tests, zensical build into ./site
#          zensical serve                 # live preview at http://127.0.0.1:8000
# Deps:    pip install ../oryxflow -r docs/requirements-docs.txt

[project]
# site_url is the CANONICAL origin. The docs live on the docs.oryxflow.dev subdomain (not
# the apex) on purpose: it's the stable, long-lived home for documentation, insulated from
# whatever the apex oryxflow.dev becomes later (e.g. a marketing site or a blog re-platformed)
# - so links into the docs never break. The docs are also reachable via the
# *.pages.dev Cloudflare preview and GitHub, but docs.oryxflow.dev is canonical: the theme
# stamps <link rel="canonical"> from this value, and sitemap.xml <loc> and the llms.txt URLs
# are built from it - so every copy points search engines and AI crawlers back to it. Keep
# this as the production docs domain, not a deploy-preview URL.
site_name = "oryxflow"
site_url = "https://docs.oryxflow.dev/"
site_description = """oryxflow is an open-source Python library and Claude Code plugin for trustworthy, reproducible \
AI data analysis: no result is ever built on stale data, every result records the code and \
inputs that made it, and because finished steps are never recomputed the trustworthy path is \
also the fast, cheap one — lineage-tracked pipelines, local-first, no server or account."""
site_author = "Oryx Intelligence LLC"
copyright = "Copyright &copy; 2026 Oryx Intelligence LLC"

repo_url = "https://github.com/oryxintel/oryxflow"
repo_name = "oryxintel/oryxflow"
edit_uri = "https://github.com/oryxintel/oryxlib-docs/edit/main/docs/"

docs_dir = "docs"

extra_css = ["assets/extra.css"]

# Turns the "oryxflow" wordmark in the top banner and the sidebar heading into
# links home - the theme renders both as dead text. See the file's comment.
extra_javascript = ["assets/extra.js"]

# Everything under docs/ that is NOT part of the published site. gitignore syntax.
# (Internal design notes, notebooks, loose example scripts, build junk.)
exclude_docs = """
todo/
system/
_build/
__pycache__/
.ipynb_checkpoints/
data/
*.py
*.ipynb
*.sh
oryxflow-docs-graph.png
"""

nav = [
