name: Docs

# Build the Zensical site and run the documentation-example tests. This validates that the
# docs build and that every runnable example still works. It does NOT deploy: Cloudflare
# Pages builds this repo from Git on every push to main (see README.md).
#
# The default (fetching) build runs against oryxflow main, so a library change that breaks
# the docs is caught, including by the nightly schedule. The oryxeval repo has no GitHub
# remote yet, so its changelog comes from the committed _external/ snapshot
# (--use-snapshot oryxeval). Once the repo exists: add a checkout step and drop the flag.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Siblings in the workspace: oryxlib-docs/ and oryxflow/ next to each other.
      - uses: actions/checkout@v7
        with:
          path: oryxlib-docs
          fetch-depth: 0   # real commit dates for sitemap lastmod / dateModified

      - uses: actions/checkout@v7
        with:
          repository: oryxintel/oryxflow
          path: oryxflow

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./oryxflow -r oryxlib-docs/docs/requirements-docs.txt

      - name: Build docs + run doc-example tests
        working-directory: oryxlib-docs
        run: python scripts/build_docs.py --src-root .. --use-snapshot oryxeval
